[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bundlemaker"
version = "2.2.0"
description = "LLM-friendly project bundler with patch apply, verify, and restore workflow support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Jo Yun-Sung" }
]
keywords = ["llm", "ai", "bundle", "cli", "patch", "verify", "restore", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities"
]

[project.scripts]
bundlemaker = "bundlemaker:main"

[tool.setuptools]
py-modules = ["bundlemaker"]